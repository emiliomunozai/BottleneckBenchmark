# Set task sweep: vocabulary size (V).
# Fixed: L=16, s=0, η=0. Swept: V ∈ {4, 8, 16, 32, 64}.
#
# Pilot result (V=8 baseline): all three architectures EG=2 (d_b*=4).
# r grid {0.5, 1, 2, 3, 5} brackets the 0→1 transition for set.
# d_min(L=16, V, s=0) = ceil(16*log2(V)/32):
#   V=4 → d_min=1, V=8 → d_min=2, V=16 → d_min=2, V=32 → d_min=3, V=64 → d_min=3
#
# V=8 runs (pilot) will be skipped by the CLI dedup.
# New runs: 4 V × 5r × 3arch × 3seeds = 180
# Total in config: 5 V × 5r × 3arch × 3seeds = 225
#
# Run: uv run bb run -c configs/set_sweep_V.yaml --no-save-model

task: set
loss: cross_entropy
sequence_length: 16
vocabulary_size: [4, 8, 16, 32, 64]
input_noise: 0.0
structural_regularity: 0.0
corruption_mode: replace
batch_size: 128
steps: 20000
eval_every: 500
seed: [42, 123, 456]
early_stopping: true
patience: 10
no_hope_after_evals: 100
no_hope_threshold: 0.01

models:
  - encoder: bi_lstm
    decoder: lstm
    n_layers: 2

  - encoder: transformer
    decoder: lstm
    n_layers: 2
    n_heads: 4

  - encoder: bi_ssm
    decoder: lstm
    n_layers: 2

d_model: 128
capacity_ratio: [0.5, 1, 2, 3, 5]
