# Appendix: training-recipe sensitivity, Transformer, L=32.
# Same cell and seeds as the L=32 row of copy_sweep_L.yaml, plus 1000-step linear LR warmup.
# Total runs: 1 L x 4 r x 3 seeds = 12
# Run: uv run bb run -c configs/paper/warmup_transformer_L32.yaml --no-save-model -o data/results/warmup.csv

task: copy
loss: cross_entropy
sequence_length: 32
vocabulary_size: 8
input_noise: 0.0
structural_regularity: 0.0
corruption_mode: replace
batch_size: 128
steps: 20000
eval_every: 500
seed: [42, 123, 456]
early_stopping: true
patience: 10
no_hope_after_evals: 100
no_hope_threshold: 0.01
warmup_steps: 1000

models:
  - encoder: transformer
    decoder: lstm
    n_layers: 2
    n_heads: 4

d_model: 128
capacity_ratio: [5, 10, 20, 40]
