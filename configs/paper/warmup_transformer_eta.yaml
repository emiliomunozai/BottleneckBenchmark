# Appendix: training-recipe sensitivity, Transformer, input-noise branch.
# Same cells and seeds as copy_sweep_eta.yaml, plus a linear LR warmup over the first
# 1000 steps (5% of the step budget). No other change to the default recipe.
# Total runs: 4 eta x 4 r x 3 seeds = 48
# Run: uv run bb run -c configs/paper/warmup_transformer_eta.yaml --no-save-model -o data/results/warmup.csv

task: copy
loss: cross_entropy
sequence_length: 16
vocabulary_size: 8
input_noise: [0.0, 0.1, 0.2, 0.3]
structural_regularity: 0.0
corruption_mode: replace
batch_size: 128
steps: 20000
eval_every: 500
seed: [42, 123, 456]
early_stopping: true
patience: 10
no_hope_after_evals: 100
no_hope_threshold: 0.01
warmup_steps: 1000

models:
  - encoder: transformer
    decoder: lstm
    n_layers: 2
    n_heads: 4

d_model: 128
capacity_ratio: [5, 10, 20, 40]
