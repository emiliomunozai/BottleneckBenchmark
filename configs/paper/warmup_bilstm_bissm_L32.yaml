# Appendix: training-recipe sensitivity, BiLSTM and BiSSM, L=32.
# Total runs: 1 L x 4 r x 3 seeds x 2 encoders = 24
# Run: uv run bb run -c configs/paper/warmup_bilstm_bissm_L32.yaml --no-save-model -o data/results/warmup.csv

task: copy
loss: cross_entropy
sequence_length: 32
vocabulary_size: 8
input_noise: 0.0
structural_regularity: 0.0
corruption_mode: replace
batch_size: 128
steps: 20000
eval_every: 500
seed: [42, 123, 456]
early_stopping: true
patience: 10
no_hope_after_evals: 100
no_hope_threshold: 0.01
warmup_steps: 1000

models:
  - encoder: bi_lstm
    decoder: lstm
    n_layers: 2
  - encoder: bi_ssm
    decoder: lstm
    n_layers: 2

d_model: 128
capacity_ratio: [5, 10, 20, 40]
