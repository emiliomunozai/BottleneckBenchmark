# Factor interaction sweep: sequence length (L), vocabulary size (V), structural regularity (s), input noise (η).
# Run: uv run bb run -c configs/factor_interaction.yaml -o data/results/factor_interaction.csv --no-save-model
task: copy
encoder: bi_lstm          # single model to keep it small
sequence_length: [16, 64, 128]         # L: low / high
vocabulary_size: [8, 32, 64]          # V: low / high
structural_regularity: [0.0, 0.25, 0.5] # s: low / high
input_noise: [0.0, 0.15, 0.3]           # η: low / high
seed: [42, 123, 456]
capacity_ratio: [5, 10, 20, 40]
d_model: 128
n_layers: 2
batch_size: 128
steps: 20000
eval_every: 500
no_hope_after_evals: 100
