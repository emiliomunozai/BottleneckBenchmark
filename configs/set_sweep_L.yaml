# Set task sweep: sequence length (L).
# Fixed: V=8, s=0, η=0. Swept: L ∈ {8, 16, 32, 64, 96}.
#
# Pilot result (L=16 baseline): all three architectures EG=2 (d_b*=4).
# r grid {0.5, 1, 2, 3, 5} brackets the 0→1 transition for set.
# d_min(L, V=8, s=0) = ceil(L*3/32):
#   L=8 → d_min=1, L=16 → d_min=2, L=32 → d_min=3, L=64 → d_min=6, L=96 → d_min=9
#
# L=16 runs (pilot) will be skipped by the CLI dedup.
# New runs: 4 L × 5r × 3arch × 3seeds = 180
# Total in config: 5 L × 5r × 3arch × 3seeds = 225
#
# Run: uv run bb run -c configs/set_sweep_L.yaml --no-save-model

task: set
loss: cross_entropy
sequence_length: [8, 16, 32, 64, 96]
vocabulary_size: 8
input_noise: 0.0
structural_regularity: 0.0
corruption_mode: replace
batch_size: 128
steps: 20000
eval_every: 500
seed: [42, 123, 456]
early_stopping: true
patience: 10
no_hope_after_evals: 100
no_hope_threshold: 0.01

models:
  - encoder: bi_lstm
    decoder: lstm
    n_layers: 2

  - encoder: transformer
    decoder: lstm
    n_layers: 2
    n_heads: 4

  - encoder: bi_ssm
    decoder: lstm
    n_layers: 2

d_model: 128
capacity_ratio: [0.5, 1, 2, 3, 5]
