# Proportional-bottleneck sweep: structural regularity (s).
# Fixed: L=16, V=8, η=0. Swept: s ∈ {0, 0.25, 0.5, 0.75}.
# d_b = ceil(r * d_min(L=16, V=8, s)) for r ∈ {5, 10, 20, 40}.
#
# d_min = ceil(16 * (1-s) * log2(8) / 32) = ceil(1.5 * (1-s))
#   s=0.00 → d_min=2 | r=5→10, r=10→20, r=20→40, r=40→80
#   s=0.25 → d_min=2 | r=5→10, r=10→20, r=20→40, r=40→80  (ceil(1.125)=2)
#   s=0.50 → d_min=1 | r=5→5,  r=10→10, r=20→20, r=40→40  (ceil(0.75)=1)
#   s=0.75 → d_min=1 | r=5→5,  r=10→10, r=20→20, r=40→40  (ceil(0.375)=1)
#
# Key question: as s increases (sequences become more regular, lower entropy),
# does a proportionally smaller d_b maintain the same accuracy?
# If not, s imposes structural costs beyond what entropy predicts.
#
# Total runs: 4 s × 4 r × 3 architectures × 3 seeds = 144
# Run: uv run bb run -c configs/copy_sweep_s.yaml --no-save-model

task: copy
loss: cross_entropy
sequence_length: 16
vocabulary_size: 8
input_noise: 0.0
structural_regularity: [0.0, 0.25, 0.5, 0.75]
corruption_mode: replace
batch_size: 128
steps: 20000
eval_every: 500
seed: [42, 123, 456]
early_stopping: true
patience: 10
no_hope_after_evals: 100
no_hope_threshold: 0.01

models:
  - encoder: bi_lstm
    decoder: lstm
    n_layers: 2

  - encoder: transformer
    decoder: lstm
    n_layers: 2
    n_heads: 4

  - encoder: bi_ssm
    decoder: lstm
    n_layers: 2

d_model: 128
capacity_ratio: [5, 10, 20, 40]
